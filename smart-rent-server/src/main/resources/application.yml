# 服务端口（8080 被其他程序占用，改用 8081）
server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接 smart_rent 数据库；serverTimezone 与新加坡时区一致
    url: jdbc:mysql://localhost:3306/smart_rent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Singapore&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 数据库下划线字段自动转成 Java 驼峰命名（如 create_time -> createTime）
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便开发调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增
      id-type: auto

# AI 大模型配置（通用：换 OpenAI/通义等 OpenAI 兼容接口只需改这三项）
ai:
  deepseek:
    base-url: https://api.deepseek.com
    # API Key 优先从环境变量 DEEPSEEK_API_KEY 读取；留空则 AI 功能自动降级为规则推荐
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
